<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
      .bar { fill: #1e3a8a; }
      .brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 24px; fill: #1e3a8a; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-transform: uppercase; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .bold { font-weight: 700; fill: #0f172a; }
      .tbl-header { fill: #f1f5f9; }
      .tbl-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .line { stroke: #e2e8f0; stroke-width: 1; }
      .total-box { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; rx: 6; }
      .audit-warn { fill: #fef2f2; stroke: #f87171; stroke-width: 1; rx: 4; }
    </style>
  </defs>

  <rect width="600" height="850" class="bg" />

  <g transform="translate(30, 25)">
    <rect width="540" height="800" class="card" />

    <path d="M 0 8 Q 0 0 8 0 L 532 0 Q 540 0 540 8 L 540 12 L 0 12 Z" class="bar" />

    <text x="30" y="52" class="brand">FEATHERLITE</text>
    <text x="30" y="70" class="text">Featherlite Furniture Solutions Pvt Ltd • GSTIN: 29AABCF4392M1ZN</text>
    <text x="510" y="52" class="title" text-anchor="end">TAX INVOICE</text>
    <text x="510" y="70" class="text" text-anchor="end">Invoice No: <tspan class="bold">FL-BLR-2026-4019</tspan></text>

    <line x1="30" y1="90" x2="510" y2="90" class="line" />

    <!-- Bill to -->
    <rect x="30" y="105" width="230" height="90" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
    <text x="45" y="125" class="bold" font-size="11">BILL TO:</text>
    <text x="45" y="145" class="bold" font-size="13">Priya Patel</text>
    <text x="45" y="165" class="text">Finance Department • Remote Employee</text>
    <text x="45" y="180" class="text">New Delhi, India</text>

    <rect x="280" y="105" width="230" height="90" fill="#f8fafc" stroke="#e2e8f0" rx="4" />
    <text x="295" y="125" class="bold" font-size="11">DISPATCH &amp; DATES:</text>
    <text x="295" y="145" class="text">Invoice Date: <tspan class="bold">18 Sep 2026</tspan></text>
    <text x="295" y="165" class="text">Delivery: Doorstep Delivery Complete</text>
    <text x="295" y="180" class="text">Payment: Net Banking (Paid)</text>

    <!-- Table -->
    <rect x="30" y="220" width="480" height="30" class="tbl-header" />
    <text x="45" y="240" class="tbl-text">PRODUCT DESCRIPTION</text>
    <text x="280" y="240" class="tbl-text" text-anchor="middle">HSN</text>
    <text x="350" y="240" class="tbl-text" text-anchor="middle">QTY</text>
    <text x="500" y="240" class="tbl-text" text-anchor="end">AMOUNT (INR)</text>

    <text x="45" y="275" class="bold" font-size="12">Featherlite Liberate High Back Chair</text>
    <text x="45" y="292" class="text">Ergonomic Mesh, Dynamic Synchro Mechanism, 3D Arms (Black)</text>
    <text x="280" y="280" class="text" text-anchor="middle">94031000</text>
    <text x="350" y="280" class="text" text-anchor="middle">1</text>
    <text x="500" y="280" class="bold" text-anchor="end">₹10,593.22</text>

    <line x1="30" y1="315" x2="510" y2="315" class="line" />

    <!-- Subtotals -->
    <text x="45" y="350" class="text">Subtotal (Taxable Value)</text>
    <text x="500" y="350" class="bold" text-anchor="end">₹10,593.22</text>

    <text x="45" y="380" class="text">Integrated GST (IGST @ 18%)</text>
    <text x="500" y="380" class="text" text-anchor="end">₹1,906.78</text>

    <line x1="30" y1="410" x2="510" y2="410" stroke="#cbd5e1" stroke-width="2" />

    <!-- Total Amount -->
    <rect x="30" y="430" width="480" height="85" class="total-box" />
    <text x="50" y="460" class="text" font-weight="700" fill="#9a3412">TOTAL INVOICE VALUE</text>
    <text x="50" y="495" class="bold" font-size="28" fill="#9a3412">₹12,500.00</text>

    <!-- Company Audit Note -->
    <rect x="30" y="535" width="480" height="55" class="audit-warn" />
    <text x="45" y="558" class="bold" font-size="11" fill="#b91c1c">AUDIT &amp; POLICY COMPLIANCE NOTE:</text>
    <text x="45" y="575" class="text" fill="#b91c1c">Claim exceeds single-item quarterly work-from-home allowance cap of ₹5,000 without prior VP pre-approval.</text>

    <!-- Footer -->
    <line x1="30" y1="620" x2="510" y2="620" class="line" />
    <text x="30" y="650" class="bold" font-size="11">Featherlite Factory &amp; Registered Office:</text>
    <text x="30" y="670" class="text">#16/A, Millers Road, Vasanthnagar, Bangalore, Karnataka 560052</text>
    <text x="30" y="690" class="text">Support: care@featherlitefurniture.com | Toll-free: 1800 102 3450</text>
    <text x="30" y="730" class="text" font-size="10" fill="#94a3b8">Authorized Electronic Tax Invoice. Input Tax Credit valid under GST Law.</text>
  </g>
</svg>

