<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
      .indigo-bar { fill: #001b94; }
      .brand { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; font-size: 26px; fill: #001b94; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-transform: uppercase; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .bold { font-weight: 700; fill: #0f172a; }
      .pnr-box { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1; rx: 6; }
      .tbl-header { fill: #f1f5f9; }
      .tbl-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .line { stroke: #e2e8f0; stroke-width: 1; }
      .dashed { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
    </style>
  </defs>

  <rect width="600" height="850" class="bg" />

  <g transform="translate(30, 25)">
    <rect width="540" height="800" class="card" />

    <!-- Blue Top Accent -->
    <path d="M 0 8 Q 0 0 8 0 L 532 0 Q 540 0 540 8 L 540 12 L 0 12 Z" class="indigo-bar" />

    <!-- Airline Header -->
    <text x="30" y="52" class="brand">IndiGo</text>
    <text x="30" y="70" class="text">InterGlobe Aviation Ltd • GSTIN: 07AABCI3819Q1ZN</text>
    <text x="510" y="52" class="title" text-anchor="end">ITINERARY &amp; TAX INVOICE</text>
    <text x="510" y="70" class="text" text-anchor="end">Date of Issue: <tspan class="bold">01 Nov 2026</tspan></text>

    <line x1="30" y1="90" x2="510" y2="90" class="line" />

    <!-- PNR and Passenger Box -->
    <rect x="30" y="105" width="480" height="70" class="pnr-box" />
    <text x="45" y="130" class="text" font-size="11" font-weight="600" fill="#3730a3">BOOKING REFERENCE (PNR)</text>
    <text x="45" y="160" class="bold" font-size="24" fill="#312e81">6E-IND742</text>
    <text x="250" y="130" class="text" font-size="11" font-weight="600" fill="#3730a3">PASSENGER NAME</text>
    <text x="250" y="155" class="bold" font-size="14">Vikram Malhotra (Test Employee)</text>
    <text x="250" y="170" class="text" font-size="11">Frequent Flyer: 6E-908214</text>

    <!-- Flight Segment -->
    <rect x="30" y="195" width="480" height="110" fill="#ffffff" stroke="#e2e8f0" rx="6" />
    
    <text x="50" y="230" class="bold" font-size="20">DEL</text>
    <text x="50" y="248" class="text" font-size="11">New Delhi (Terminal 1)</text>
    <text x="50" y="280" class="bold" font-size="13">06:45 AM</text>
    <text x="50" y="295" class="text" font-size="11">01 Nov 2026</text>

    <!-- Flight Plane Icon Arrow -->
    <line x1="160" y1="240" x2="350" y2="240" stroke="#001b94" stroke-width="2" />
    <polygon points="350,236 360,240 350,244" fill="#001b94" />
    <text x="255" y="230" class="bold" font-size="11" fill="#001b94" text-anchor="middle">Flight 6E-2045 (2h 15m)</text>
    <text x="255" y="258" class="text" font-size="10" text-anchor="middle">Non-Stop • Seat 14F</text>

    <text x="490" y="230" class="bold" font-size="20" text-anchor="end">BOM</text>
    <text x="490" y="248" class="text" font-size="11" text-anchor="end">Mumbai (Terminal 2)</text>
    <text x="490" y="280" class="bold" font-size="13" text-anchor="end">09:00 AM</text>
    <text x="490" y="295" class="text" font-size="11" text-anchor="end">01 Nov 2026</text>

    <!-- Fare Breakdown Table -->
    <text x="30" y="340" class="title">Fare Breakdown &amp; GST Details</text>

    <rect x="30" y="355" width="480" height="28" class="tbl-header" />
    <text x="45" y="373" class="tbl-text">FARE ITEM</text>
    <text x="300" y="373" class="tbl-text" text-anchor="middle">SAC CODE</text>
    <text x="500" y="373" class="tbl-text" text-anchor="end">AMOUNT (INR)</text>

    <text x="45" y="405" class="text">Airfare (Basic Fare)</text>
    <text x="300" y="405" class="text" text-anchor="middle">996411</text>
    <text x="500" y="405" class="bold" text-anchor="end">₹5,400.00</text>

    <text x="45" y="430" class="text">Aviation Fuel Surcharge (YQ)</text>
    <text x="300" y="430" class="text" text-anchor="middle">996411</text>
    <text x="500" y="430" class="bold" text-anchor="end">₹820.00</text>

    <text x="45" y="455" class="text">User Development Fee (UDF / PSF)</text>
    <text x="300" y="455" class="text" text-anchor="middle">996411</text>
    <text x="500" y="455" class="bold" text-anchor="end">₹290.00</text>

    <text x="45" y="480" class="text">Goods &amp; Services Tax (5% Economy GST)</text>
    <text x="300" y="480" class="text" text-anchor="middle">996411</text>
    <text x="500" y="480" class="bold" text-anchor="end">₹290.00</text>

    <line x1="30" y1="505" x2="510" y2="505" stroke="#cbd5e1" stroke-width="2" />

    <!-- Total Amount Box -->
    <rect x="30" y="525" width="480" height="85" fill="#eff6ff" stroke="#93c5fd" rx="6" />
    <text x="50" y="555" class="text" font-weight="700" fill="#1e40af">TOTAL FARE PAID (ALL INCLUSIVE)</text>
    <text x="50" y="595" class="bold" font-size="28" fill="#1e3a8a">₹6,800.00</text>
    <text x="490" y="565" class="bold" font-size="13" fill="#166534" text-anchor="end">✓ PAYMENT CONFIRMED</text>
    <text x="490" y="585" class="text" font-size="11" text-anchor="end">Corporate NetBanking (ICICI Bank)</text>

    <!-- Footer -->
    <line x1="30" y1="640" x2="510" y2="640" class="line" />
    <text x="30" y="670" class="bold" font-size="11">InterGlobe Aviation Ltd. Registered Office:</text>
    <text x="30" y="690" class="text">Upper Ground Floor, Thapar House, Gate No. 2, Western Wing, 124 Janpath, New Delhi 110001</text>
    <text x="30" y="710" class="text">Business Purpose: Client Project Kick-Off &amp; Technical Architecture Workshop in Mumbai</text>
    <text x="30" y="735" class="text" font-size="10" fill="#94a3b8">Baggage Allowance: 15 Kg Check-in + 7 Kg Hand Baggage Included.</text>
  </g>
</svg>

