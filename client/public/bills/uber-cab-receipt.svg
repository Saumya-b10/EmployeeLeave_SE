<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f3f4f6; }
      .card { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1; rx: 6; }
      .uber-logo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 28px; fill: #000000; letter-spacing: -1px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #4b5563; }
      .bold { font-weight: 700; fill: #111827; }
      .line { stroke: #e5e7eb; stroke-width: 1; }
      .dashed { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 4,4; }
      .total-amount { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #000000; }
    </style>
  </defs>

  <rect width="500" height="800" class="bg" />

  <g transform="translate(35, 25)">
    <rect width="430" height="750" class="card" />

    <!-- Uber Header -->
    <text x="30" y="55" class="uber-logo">Uber</text>
    <text x="400" y="45" class="text" text-anchor="end">Trip Receipt</text>
    <text x="400" y="65" class="text" text-anchor="end">28 Oct 2026, 06:15 AM</text>

    <line x1="30" y1="85" x2="400" y2="85" class="line" />

    <!-- Amount Hero -->
    <text x="30" y="125" class="text">Total Charged (INR)</text>
    <text x="30" y="165" class="total-amount">₹650.00</text>
    <text x="30" y="188" class="text">Paid with <tspan class="bold">Google Pay UPI (ending in 9214)</tspan></text>

    <line x1="30" y1="210" x2="400" y2="210" class="line" />

    <!-- Trip Details -->
    <text x="30" y="240" class="title">Trip Breakdown</text>

    <circle cx="38" cy="270" r="5" fill="#000000" />
    <text x="52" y="270" class="bold" font-size="12">Nehru Place Corporate Tower</text>
    <text x="52" y="285" class="text" font-size="11">06:18 AM • South Delhi</text>

    <line x1="38" y1="280" x2="38" y2="320" stroke="#000000" stroke-width="1.5" stroke-dasharray="3,3" />

    <rect x="33" y="325" width="10" height="10" fill="#000000" />
    <text x="52" y="332" class="bold" font-size="12">Terminal 3, Indira Gandhi Int'l Airport</text>
    <text x="52" y="347" class="text" font-size="11">06:56 AM • New Delhi (21.4 km, 38 mins)</text>

    <line x1="30" y1="375" x2="400" y2="375" class="line" />

    <!-- Fare Table -->
    <text x="30" y="405" class="text">Base Fare (Uber Go)</text>
    <text x="400" y="405" class="bold" text-anchor="end">₹120.00</text>

    <text x="30" y="430" class="text">Distance Charge (21.4 km)</text>
    <text x="400" y="430" class="bold" text-anchor="end">₹342.40</text>

    <text x="30" y="455" class="text">Time Charge (38 mins)</text>
    <text x="400" y="455" class="bold" text-anchor="end">₹76.00</text>

    <text x="30" y="480" class="text">Airport Toll / Parking Access Fee</text>
    <text x="400" y="480" class="bold" text-anchor="end">₹80.00</text>

    <text x="30" y="505" class="text">GST (5% Ride Services)</text>
    <text x="400" y="505" class="bold" text-anchor="end">₹31.60</text>

    <line x1="30" y1="530" x2="400" y2="530" stroke="#000000" stroke-width="1.5" />

    <text x="30" y="560" class="bold" font-size="14">Total Amount Paid:</text>
    <text x="400" y="560" class="bold" font-size="16" text-anchor="end">₹650.00</text>

    <!-- Passenger and Driver info -->
    <line x1="30" y1="590" x2="400" y2="590" class="line" />
    <text x="30" y="620" class="text">Passenger: <tspan class="bold">Vikram Malhotra (Test Employee)</tspan></text>
    <text x="30" y="640" class="text">Driver Partner: Sukhvinder S. (Maruti Swift Dzire • DL 1YB 4092)</text>
    <text x="30" y="660" class="text">Invoice Issued By: Uber B.V. / Uber India Systems Pvt Ltd</text>
    <text x="30" y="680" class="text">GSTIN: <tspan class="bold">07AAGCU2109M1ZH</tspan> | SAC Code: 996412</text>
    <text x="30" y="715" class="text" font-size="10" fill="#9ca3af">Electronic Receipt generated by Uber Technologies. Valid for official expense reimbursements.</text>
  </g>
</svg>

